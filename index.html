<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Barcode Bridge</title>

<script src="https://unpkg.com/@zxing/library@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

body{
    margin:0;
    background:white;
    font-family:sans-serif;
    text-align:center;
}

#scan-area{
    display:block;
}

#video{
    width:100%;
    max-width:500px;
    margin-top:20px;
    border:4px solid #333;
}

#barcode-area{
    display:none;
    padding:20px;
}

#memberCode{
    font-size:32px;
    font-weight:bold;
    margin-top:30px;
    word-break:break-all;
}

button{
    font-size:24px;
    padding:15px 30px;
    margin-top:40px;
}

h1{
    margin-top:20px;
}

#guide{
    font-size:22px;
    margin-top:20px;
}

</style>
</head>

<body>

<div id="scan-area">

    <h1>会員バーコード読取</h1>

    <video id="video" autoplay playsinline></video>

    <div id="guide">
        バーコードをカメラに向けてください
    </div>

</div>

<div id="barcode-area">

    <h1>POSでスキャンしてください</h1>

    <div id="memberCode"></div>

    <svg id="barcode"></svg>

    <br>

    <button onclick="goBack()">戻る</button>

</div>

<script>

const scanArea = document.getElementById("scan-area");
const barcodeArea = document.getElementById("barcode-area");
const memberCode = document.getElementById("memberCode");

const codeReader = new ZXing.BrowserMultiFormatReader();

async function startScanner(){

    try{

        const videoInputDevices =
            await codeReader.listVideoInputDevices();

        const selectedDeviceId =
            videoInputDevices[0].deviceId;

        codeReader.decodeFromVideoDevice(
            selectedDeviceId,
            'video',
            (result, err) => {

                if(result){

                    const code = result.text;

                    codeReader.reset();

                    showBarcode(code);
                }
            }
        );

    }catch(error){

        alert("カメラ起動エラー：" + error);
    }
}

function showBarcode(code){

    scanArea.style.display = "none";
    barcodeArea.style.display = "block";

    memberCode.innerText = code;

    JsBarcode("#barcode", code, {

        format:"CODE128",

        width:4,
        height:150,

        displayValue:false,

        background:"#ffffff",
        lineColor:"#000000",

        margin:20

    });
}

function goBack(){

    barcodeArea.style.display = "none";
    scanArea.style.display = "block";

    startScanner();
}

startScanner();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Member OCR Bridge</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

body{
    margin:0;
    background:#ffffff;
    font-family:sans-serif;
    text-align:center;
}

h1{
    margin-top:20px;
}

#video{
    width:95%;
    max-width:600px;
    border:4px solid #333;
    border-radius:10px;
    margin-top:20px;
}

#captureBtn{
    margin-top:25px;
    font-size:28px;
    padding:15px 40px;
}

#status{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}

#barcode-area{
    display:none;
    padding:20px;
}

#memberCode{
    font-size:34px;
    font-weight:bold;
    margin-top:30px;
    word-break:break-all;
}

svg{
    margin-top:40px;
}

button{
    margin-top:40px;
    font-size:28px;
    padding:15px 40px;
}

canvas{
    display:none;
}

</style>

</head>

<body>

<div id="scan-area">

    <h1>会員番号OCR読取</h1>

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <br>

    <button id="captureBtn">

        読み取る

    </button>

    <div id="status">

        会員番号を画面中央に合わせてください

    </div>

</div>

<div id="barcode-area">

    <h1>POSでスキャンしてください</h1>

    <div id="memberCode"></div>

    <svg id="barcode"></svg>

    <br>

    <button onclick="goBack()">

        戻る

    </button>

</div>

<canvas id="canvas"></canvas>

<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const captureBtn =
    document.getElementById("captureBtn");

const statusText =
    document.getElementById("status");

const scanArea =
    document.getElementById("scan-area");

const barcodeArea =
    document.getElementById("barcode-area");

const memberCode =
    document.getElementById("memberCode");

async function startCamera(){

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"environment"
                },

                audio:false
            });

        video.srcObject = stream;

    }catch(error){

        alert(
            "カメラ起動失敗：" + error
        );
    }
}

captureBtn.addEventListener(
    "click",
    async () => {

        statusText.innerText =
            "OCR解析中...";

        const context =
            canvas.getContext("2d");

        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;

        context.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );

        const imageData =
            canvas.toDataURL("image/png");

        try{

            const result =
                await Tesseract.recognize(

                    imageData,

                    'eng',

                    {

                        logger:m => {
                            console.log(m);
                        }

                    }
                );

            let text =
                result.data.text;

            console.log(text);

            text =
                text.replace(/\s/g,'');

            const match =
                text.match(/\d{16}/);

            if(match){

                const code =
                    match[0];

                showBarcode(code);

            }else{

                statusText.innerText =
                    "16桁数字が見つかりません";

            }

        }catch(error){

            statusText.innerText =
                "OCR失敗";

            console.error(error);
        }
    }
);

function showBarcode(code){

    scanArea.style.display =
        "none";

    barcodeArea.style.display =
        "block";

    memberCode.innerText =
        code;

    JsBarcode(

        "#barcode",

        code,

        {

            format:"CODE128",

            width:4,

            height:180,

            displayValue:false,

            background:"#ffffff",

            lineColor:"#000000",

            margin:20
        }
    );
}

function goBack(){

    barcodeArea.style.display =
        "none";

    scanArea.style.display =
        "block";

    statusText.innerText =
        "会員番号を画面中央に合わせてください";
}

startCamera();

</script>

</body>

</html>

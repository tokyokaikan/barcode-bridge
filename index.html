# 元画像風バーコード版 index.html

以下を `index.html` にそのまま貼り付けて保存してください。

```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Bridge</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

body{
    margin:0;
    background:#ffffff;
    font-family:sans-serif;
    text-align:center;
}

h1{
    font-size:28px;
    margin-top:20px;
}

#camera-wrap{
    position:relative;
    display:inline-block;
    width:100%;
}

#video{
    width:95%;
    max-width:600px;
    border:4px solid #333;
    border-radius:10px;
    margin-top:20px;
}

#scan-guide{
    position:absolute;
    left:12%;
    top:45%;
    width:76%;
    height:16%;
    border:3px solid red;
    box-sizing:border-box;
    pointer-events:none;
}

#guide{
    margin-top:15px;
    font-size:18px;
    font-weight:bold;
}

#captureBtn{
    margin-top:20px;
    font-size:22px;
    padding:14px 34px;
}

#status{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
}

#barcode-area{
    display:none;
    background:#ffffff;
    padding:10px;
}

#memberCode{
    font-size:22px;
    font-weight:bold;
    letter-spacing:2px;
    margin-top:20px;
    color:#3d1d3d;
}

#barcode-wrap{
    width:100%;
    overflow-x:auto;
    margin-top:20px;
}

svg{
    width:95%;
    max-width:680px;
    height:140px;
}

button{
    margin-top:30px;
    font-size:22px;
    padding:14px 36px;
}

canvas{
    display:none;
}

</style>
</head>
<body>

<div id="scan-area">

    <h1>会員番号OCR読取</h1>

    <div id="camera-wrap">

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

        <div id="scan-guide"></div>

    </div>

    <div id="guide">
        会員番号を赤枠に合わせてください
    </div>

    <button id="captureBtn">
        読み取る
    </button>

    <div id="status">
        待機中
    </div>

</div>

<div id="barcode-area">

    <h1>POSでスキャンしてください</h1>

    <div id="barcode-wrap">
        <svg id="barcode"></svg>
    </div>

    <div id="memberCode"></div>

    <button onclick="goBack()">
        戻る
    </button>

</div>

<canvas id="canvas"></canvas>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const captureBtn = document.getElementById("captureBtn");
const statusText = document.getElementById("status");
const scanArea = document.getElementById("scan-area");
const barcodeArea = document.getElementById("barcode-area");
const memberCode = document.getElementById("memberCode");

async function startCamera(){

    try{

        const stream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"environment"
            },
            audio:false
        });

        video.srcObject = stream;

    }catch(error){

        alert("カメラ起動失敗：" + error);
    }
}

captureBtn.addEventListener(
    "click",
    async () => {

        statusText.innerText = "OCR解析中...";

        const context = canvas.getContext("2d");

        const vw = video.videoWidth;
        const vh = video.videoHeight;

        const cropY = vh * 0.45;
        const cropHeight = vh * 0.16;

        canvas.width = vw;
        canvas.height = cropHeight;

        context.drawImage(
            video,
            0,
            cropY,
            vw,
            cropHeight,
            0,
            0,
            vw,
            cropHeight
        );

        const imageData = canvas.toDataURL("image/png");

        try{

            const result = await Tesseract.recognize(
                imageData,
                'eng',
                {
                    tessedit_char_whitelist:'0123456789'
                }
            );

            let text = result.data.text;

            text = text.replace(/\s/g,'');

            const match = text.match(/\d{16}/);

            if(match){

                const code = match[0];

                showBarcode(code);

            }else{

                statusText.innerText = "16桁数字が見つかりません";
            }

        }catch(error){

            statusText.innerText = "OCR失敗";
            console.error(error);
        }
    }
);

function formatNumber(code){

    return code.replace(/(.{4})/g, '$1 ').trim();
}

function showBarcode(code){

    scanArea.style.display = "none";
    barcodeArea.style.display = "block";

    memberCode.innerText = formatNumber(code);

    JsBarcode(
        "#barcode",
        code,
        {
            format:"CODE128",
            width:1.7,
            height:110,
            displayValue:false,
            background:"#ffffff",
            lineColor:"#000000",
            margin:0
        }
    );
}

function goBack(){

    barcodeArea.style.display = "none";
    scanArea.style.display = "block";
    statusText.innerText = "待機中";
}

startCamera();

</script>
</body>
</html>
```

## ポイント

今回の版では、元画像に近い見た目にするため：

* CODE128形式
* 高さを高め
* 線幅を少し太め
* バーコードを上配置
* 数字を4桁区切り表示

にしています。

画像を見る限り、元の会員証バーコードは NW-7 ではなく、CODE128系の可能性が高いです。
